apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "clamav.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: clamav
  ports:
    - name: tcp
      port: {{ .Values.service.ports.clamav.port }}
      targetPort: {{ .Values.service.ports.clamav.targetPort }}