apiVersion: v1
kind: Secret
metadata:
  name: clamav-api-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "clamav.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  AUTH_API_KEY: {{ required "authApiKey is required — set it via --set authApiKey=xxx or in your values file" .Values.authApiKey | quote }}