apiVersion: v1
kind: ConfigMap
metadata:
  name: clamav-conf
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "clamav.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ include "clamav.chart" . }}
data:
  clamd.conf: |
{{ .Values.clamdConfig | indent 4 }}
  freshclam.conf: |
{{ .Values.freshclamConfig | indent 4 }}