replicaCount: 2

image:
  repository: aleskapot/clamav-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets:
  - name: private-registry-secret

service:
  type: ClusterIP
  port: 80

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

env:
  # AUTH_API_KEY is expected to be supplied via a secret named clamav-api-auth with key AUTH_API_KEY
  CLAMAV_HOST: "clamav.host"
  CLAMAV_PORT: "30331"
  WEBHOOK_URL: "https://webhook.url:8080/"

# Secret definition (optional, can be managed outside)
secret:
  # If set to true, the chart will create a secret with the AUTH_API_KEY.
  # The value should be provided via .Values.secret.authApiKey or via existing secret.
  create: false
  authApiKey: ""  # e.g., "change-me" if you want the chart to create the secret
